# LibWrt（tvliving/LibWrt，NSS 满血源码树）qualcommax/ipq60xx 全机型构建
# - 所有机型（TARGET_ALL_PROFILES）
# - 默认主题 luci-theme-vantage（kiddin9 feed 包，自带 30_uci-defaults 首启自动设默认）
name: 🛠️ LibWrt IPQ60XX (NSS) Build

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '是否发布到 Release'
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    name: 🔧 编译 ipq60xx 全机型
    runs-on: ubuntu-24.04
    env:
      SUBTARGET: ipq60xx
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "===== 释放前 ====="
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/lib/jvm \
                      /usr/share/swift /usr/share/miniconda /usr/share/rust
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "===== 释放后 ====="
          df -h / | tail -1

      - name: 安装编译依赖
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq clean
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: 拉取 luci-theme-vantage（kiddin9 feed，含 30_uci-defaults 首启自动设默认主题）
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/kiddin9/op-packages.git /tmp/kiddin9
          cd /tmp/kiddin9
          git sparse-checkout set luci-theme-vantage luci-app-vantage
          cp -a luci-theme-vantage luci-app-vantage "$GITHUB_WORKSPACE/package/"
          test -f "$GITHUB_WORKSPACE/package/luci-theme-vantage/Makefile" \
            || { echo "::error::vantage 主题包拉取失败"; exit 1; }
          test -f "$GITHUB_WORKSPACE/package/luci-theme-vantage/root/etc/uci-defaults/30_luci-theme-vantage" \
            && echo "✔ vantage 主题包就绪（uci-defaults 将自动设为默认主题）"

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 生成 .config（qualcommax/ipq60xx 全机型 + vantage 默认主题）
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_${SUBTARGET}=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_PACKAGE_luci-theme-vantage=y
          EOF
          # ALL_PROFILES 的机型符号要跑两次 defconfig 才展开（首次只生成 metadata.choice），
          # 单次 defconfig 后机型数是 0（run 43150793653/43150785809 的教训）
          for i in 1 2 3; do
            grep -q "^CONFIG_TARGET_ALL_PROFILES=y" .config || echo "CONFIG_TARGET_ALL_PROFILES=y" >> .config
            make defconfig > defconfig.log 2>&1 || { tail -50 defconfig.log; exit 1; }
            N=$(grep -c "^CONFIG_TARGET_DEVICE_qualcommax_${SUBTARGET}_DEVICE_.*=y" .config || true)
            echo "第 $i 次 defconfig 后机型数: $N"
            [ "$N" -ge 10 ] && break
          done
          grep -q "^CONFIG_TARGET_qualcommax_${SUBTARGET}=y" .config \
            || { echo "::error::target 未生效"; exit 1; }
          grep -q "^CONFIG_PACKAGE_luci-theme-vantage=y" .config \
            || { echo "::error::vantage 主题未生效"; exit 1; }
          [ "$N" -ge 10 ] || { echo "::error::机型数量不足，实际 $N"; exit 1; }

      - name: 预下载软件包
        run: |
          make download -j8 || echo "::warning::make download 有失败项，构建时会重试"
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译
        run: |
          set +e
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::并行编译失败（静默模式吞错），用 -j1 V=s 复现失败包真实错误"
            FAILED=$(grep -oE "ERROR: \S+ failed to build( \(build variant: \S+\))?" build.log | awk '{print $2}' | sort -u || true)
            if [ -z "$FAILED" ]; then
              make -j1 V=s 2>&1 | tee error.log || true
            else
              for p in $FAILED; do
                echo "===== V=s 复现 $p ====="
                make -j1 V=s "$p/compile" 2>&1 | tee -a error.log || true
              done
            fi
            echo "===== error.log 尾部 150 行（真实错误） ====="
            tail -n 150 error.log 2>/dev/null || true
            exit 1
          fi
          exit 0

      - name: 校验产物
        run: |
          D=bin/targets/qualcommax/${SUBTARGET}
          mkdir -p out
          find "$D" -maxdepth 1 -type f \
            \( -name '*-squashfs-*' -o -name '*-initramfs-*' \
               -o -name 'sha256sums' -o -name 'profiles.json' \
               -o -name '*.buildinfo' -o -name '*.manifest' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          N_IMG=$(find out -name '*-squashfs-*' | wc -l)
          echo "镜像文件数: $N_IMG"
          [ "$N_IMG" -ge 10 ] || { echo "::error::镜像数量不足"; ls -la "$D" out 2>/dev/null || true; exit 1; }
          python3 - <<'PY'
          import json
          d = json.load(open('out/profiles.json'))
          print('profiles:', len(d['profiles']))
          PY
          {
            echo "## 🏗️ LibWrt qualcommax/${SUBTARGET}（NSS 满血）编译完成"
            echo ""
            echo "- 机型: $N 台（全部 squashfs/initramfs 产物）"
            echo "- LuCI 默认主题: luci-theme-vantage（首启自动生效）"
            echo "- NSS: kmod-qca-nss-drv/ecm 等 25+ 模块默认内置"
            echo ""
            echo "| 文件 |"
            echo "|---|"
            ls out | while read -r f; do echo "| $f |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ env.SUBTARGET }}
          path: out/
          retention-days: 7

      - name: 上传编译日志（失败时用于排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.SUBTARGET }}
          path: |
            build.log
            error.log
            .config
          retention-days: 7
          if-no-files-found: warn

  release:
    name: 📦 发布 Release
    needs: build
    if: always() && needs.build.result == 'success' && inputs.make_release
    runs-on: ubuntu-24.04
    env:
      SUBTARGET: ipq60xx
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: images-${{ env.SUBTARGET }}
          path: rel

      - name: 生成校验文件
        run: |
          cd rel
          ls -lh
          sha256sum * > sha256sums.txt 2>/dev/null || true

      - name: 创建 Release（libwrt-ipq60xx-日期，同日重跑自动加 -r<run号>）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="libwrt-${SUBTARGET}-$(TZ=Asia/Shanghai date +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            TAG="$TAG-r${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          LibWrt（tvliving/LibWrt 25.12-nss 分支）· qualcommax/${SUBTARGET} 全机型 · NSS 满血

          - LuCI 默认主题: luci-theme-vantage（首启 uci-defaults 自动生效）
          - NSS 加速: kmod-qca-nss-drv / kmod-qca-nss-ecm / pppoe·vxlan·map-t 等模块默认内置
          - 默认登录: 192.168.1.1（密码 none，请刷机后立即修改）
          - 触发方式: ${{ github.event_name }} · 提交: ${{ github.sha }}
          - 构建日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          gh release create "$TAG" rel/* \
            --title "LibWrt ${SUBTARGET} · NSS · $TAG" \
            --notes-file notes.md \
            --latest
